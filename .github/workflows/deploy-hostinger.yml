name: Déployer sur Hostinger

# Déclenchement manuel uniquement : aucun push ne déploie automatiquement.
# Voir DEPLOIEMENT.md pour la liste des secrets à créer.
on:
  workflow_dispatch:
    inputs:
      cible:
        description: Environnement de destination
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploiement-${{ inputs.cible }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    name: Construire et téléverser
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npx astro check

      - name: Construire
        env:
          SITE_URL: ${{ inputs.cible == 'production' && 'https://beaunegravure.fr' || 'https://dimgrey-caribou-115686.hostingersite.com' }}
          SITE_ENV: ${{ inputs.cible }}
        run: npx astro build

      - name: Contrôler le site généré
        run: node scripts/verifier.mjs

      - name: Confirmer l’indexabilité attendue
        run: |
          set -euo pipefail
          if [ "${{ inputs.cible }}" = "production" ]; then
            grep -q "Allow: /" dist/robots.txt
            grep -q "index, follow" dist/index.html
            test -f dist/sitemap-index.xml
            echo "Production : site indexable, sitemap présent."
          else
            grep -q "Disallow: /" dist/robots.txt
            grep -q "noindex, nofollow" dist/index.html
            echo "Préproduction : site non indexable."
          fi

      - name: Installer lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Téléverser
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_PASSWORD }}
          FTP_PATH: ${{ vars.HOSTINGER_TARGET }}
          FTP_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail

          for variable in FTP_HOST FTP_USER FTP_PASS; do
            if [ -z "${!variable:-}" ]; then
              echo "Secret manquant : $variable" >&2
              exit 1
            fi
          done

          # Racine réellement servie par le domaine. Sur ce compte Hostinger,
          # le serveur web sert « / » : c'est là que se trouvait la page par
          # défaut « default.php ». Le répertoire de connexion FTP est
          # « /public_html », qui n'est PAS servi — y déposer le site laissait
          # le domaine afficher indéfiniment la page par défaut.
          #
          # Le chemin de destination n'est pas une donnée sensible : il est
          # exposé comme variable de dépôt et non comme secret, afin de rester
          # lisible dans les journaux en cas de nouvelle erreur d'aiguillage.
          # « public_html » est un répertoire système du compte, non servi et
          # non supprimable : il est exclu de la synchronisation, faute de quoi
          # le déploiement échoue à la toute fin sur un « 550 Permission
          # denied » alors que tous les fichiers sont déjà en place.
          CIBLE="${FTP_PATH:-/}"
          echo "Destination distante : $CIBLE"

          # TLS obligatoire : les identifiants ne doivent jamais transiter en
          # clair. La chaîne de certification reste vérifiée ; seule la
          # correspondance du nom d'hôte est levée, car Hostinger présente un
          # certificat mutualisé qui ne porte pas le nom du serveur FTP du
          # compte. Un certificat auto-signé ou d'une autorité inconnue est
          # donc toujours rejeté.
          lftp -u "$FTP_USER,$FTP_PASS" -p "${FTP_PORT:-21}" "$FTP_HOST" <<FTP
            set ftp:ssl-force yes
            set ftp:ssl-protect-data yes
            set ssl:verify-certificate yes
            set ssl:check-hostname no
            set ftp:passive-mode yes
            set net:timeout 60
            set net:max-retries 10
            set net:reconnect-interval-base 5
            set net:reconnect-interval-multiplier 1
            set mirror:parallel-transfer-count 2
            set cmd:fail-exit yes
            mirror --reverse --delete --parallel=2 --verbose \
              --exclude-glob api/config.php \
              --exclude-glob api/.data/ \
              --exclude-glob public_html/ \
              dist/ "$CIBLE/"
            bye
          FTP

      - name: Rappel
        run: |
          echo "Déploiement terminé sur ${{ inputs.cible }}."
          echo "Vérifier api/config.php sur le serveur : il n'est jamais transféré."
