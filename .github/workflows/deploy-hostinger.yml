name: Déployer sur Hostinger

# Déclenchement manuel uniquement : aucun push ne déploie automatiquement.
# Voir DEPLOIEMENT.md pour la liste des secrets à créer.
on:
  workflow_dispatch:
    inputs:
      cible:
        description: Environnement de destination
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploiement-${{ inputs.cible }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    name: Construire et téléverser
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Le cache d'images d'Astro vit dans « .astro-cache », hors de
      # « node_modules » que « npm ci » vient d'effacer. Il est restauré ici,
      # après l'installation, pour que rien ne puisse le supprimer ensuite.
      #
      # La clef n'a pas à être parfaitement précise : le cache d'Astro est
      # adressé par contenu, chaque variante y étant rangée sous un nom dérivé
      # de l'empreinte de son image source. Une entrée périmée ne peut donc
      # jamais être servie à la place d'une autre — la clef ne joue que sur
      # l'efficacité, jamais sur la justesse.
      #
      #   package-lock.json  -> versions d'Astro et de sharp : un changement
      #                         de moteur doit tout régénérer ;
      #   astro.config.mjs   -> réglages « image » : formats, qualité, gabarit ;
      #   src/assets/**      -> les images sources elles-mêmes.
      #
      # « restore-keys » retombe sur le cache compatible le plus récent quand
      # seules les images ont changé : les variantes des autres images restent
      # ainsi réutilisées, et seule l'image modifiée est retraitée.
      - name: Restaurer le cache d'images Astro
        uses: actions/cache@v4
        with:
          path: .astro-cache
          key: astro-assets-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-assets-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-

      - name: Vérifier les types
        run: npx astro check

      - name: Construire
        env:
          SITE_URL: ${{ inputs.cible == 'production' && 'https://beaunegravure.fr' || 'https://dimgrey-caribou-115686.hostingersite.com' }}
          SITE_ENV: ${{ inputs.cible }}
        run: npx astro build

      - name: Contrôler le site généré
        run: node scripts/verifier.mjs

      - name: Confirmer l’indexabilité attendue
        run: |
          set -euo pipefail
          if [ "${{ inputs.cible }}" = "production" ]; then
            grep -q "Allow: /" dist/robots.txt
            grep -q "index, follow" dist/index.html
            test -f dist/sitemap-index.xml
            echo "Production : site indexable, sitemap présent."
          else
            grep -q "Disallow: /" dist/robots.txt
            grep -q "noindex, nofollow" dist/index.html
            echo "Préproduction : site non indexable."
          fi

      - name: Installer lftp
        # Le runner GitHub embarque des dépôts tiers — dont celui de Google
        # Chrome — qui tombent régulièrement en « Hash Sum mismatch ». Avec un
        # « && », cet échec sans rapport avec le projet empêchait purement et
        # simplement le déploiement. lftp vient de l'archive Ubuntu : la mise à
        # jour des index peut échouer partiellement sans conséquence, alors que
        # l'installation, elle, reste bloquante.
        run: |
          sudo apt-get update || echo 'Index apt partiellement indisponibles : on poursuit.'
          sudo apt-get install -y lftp

      - name: Téléverser
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_PASSWORD }}
          FTP_PATH: ${{ vars.HOSTINGER_TARGET }}
          FTP_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail

          for variable in FTP_HOST FTP_USER FTP_PASS; do
            if [ -z "${!variable:-}" ]; then
              echo "Secret manquant : $variable" >&2
              exit 1
            fi
          done

          # Racine réellement servie par le domaine. Sur ce compte Hostinger,
          # le serveur web sert « / » : c'est là que se trouvait la page par
          # défaut « default.php ». Le répertoire de connexion FTP est
          # « /public_html », qui n'est PAS servi — y déposer le site laissait
          # le domaine afficher indéfiniment la page par défaut.
          #
          # Le chemin de destination n'est pas une donnée sensible : il est
          # exposé comme variable de dépôt et non comme secret, afin de rester
          # lisible dans les journaux en cas de nouvelle erreur d'aiguillage.
          # « public_html » est un répertoire système du compte, non servi et
          # non supprimable : il est exclu de la synchronisation, faute de quoi
          # le déploiement échoue à la toute fin sur un « 550 Permission
          # denied » alors que tous les fichiers sont déjà en place.
          CIBLE="${FTP_PATH:-/}"
          echo "Destination distante : $CIBLE"

          # TLS obligatoire : les identifiants ne doivent jamais transiter en
          # clair. La chaîne de certification reste vérifiée ; seule la
          # correspondance du nom d'hôte est levée, car Hostinger présente un
          # certificat mutualisé qui ne porte pas le nom du serveur FTP du
          # compte. Un certificat auto-signé ou d'une autorité inconnue est
          # donc toujours rejeté.
          #
          # Ces réglages sont partagés mot pour mot par les deux passes : les
          # définir une seule fois garantit qu'ils ne peuvent pas diverger.
          REGLAGES='
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 10
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          set mirror:parallel-transfer-count 2
          set cmd:fail-exit yes
          '

          # Le transfert se fait en DEUX PASSES, pour une seule raison : les
          # fichiers de « _astro/ » portent dans leur nom l'empreinte de leur
          # contenu. Deux fichiers de même nom ont donc, par construction, le
          # même contenu — et un contenu modifié produit un nom différent, donc
          # un fichier absent à distance, donc transféré.
          #
          # Comparer leurs horodatages n'a par conséquent aucun sens ici : la
          # machine d'intégration continue repart vierge à chaque exécution, ses
          # fichiers sont toujours « plus récents » que les copies distantes, et
          # lftp retransférait ainsi 45 Mo d'images identiques à chaque
          # déploiement. « --ignore-time » lui fait comparer les tailles seules,
          # ce qui est exactement le bon critère POUR CE RÉPERTOIRE et pour lui
          # seul.
          #
          # Tout le reste du site — pages HTML, CSS, PHP — garde des noms
          # stables et un contenu variable : la comparaison par horodatage y
          # reste indispensable, et la passe 2 ne change donc rien au
          # comportement d'origine.

          # Un « _astro/ » vide ou absent signalerait un build cassé. Comme la
          # passe 1 porte « --delete », la laisser s'exécuter effacerait alors
          # toutes les images du site : on s'arrête net.
          if [ ! -d dist/_astro ] || [ -z "$(ls -A dist/_astro)" ]; then
            echo "dist/_astro est absent ou vide : build anormal, arrêt." >&2
            exit 1
          fi

          # « $CIBLE » vaut « / » : la concaténation directe donnerait
          # « //_astro/ ». On retire donc la barre finale avant de composer le
          # sous-chemin. La passe 2, elle, garde mot pour mot la cible
          # d'origine, dont le fonctionnement est établi.
          BASE="${CIBLE%/}"

          echo "Passe 1/2 — _astro/ : $(find dist/_astro -type f | wc -l) fichiers, comparaison par taille"
          lftp -u "$FTP_USER,$FTP_PASS" -p "${FTP_PORT:-21}" "$FTP_HOST" <<FTP
          $REGLAGES
          mirror --reverse --delete --parallel=2 --verbose \
            --ignore-time \
            dist/_astro/ "$BASE/_astro/"
          bye
          FTP

          # Passe 2 : le comportement d'origine, à l'exclusion de « _astro/ »
          # que la passe 1 vient de synchroniser. Une exclusion protège aussi
          # bien de la suppression que du transfert — c'est déjà ce qui met
          # « api/config.php », « api/.data/ » et « public_html/ » à l'abri du
          # « --delete » depuis le premier jour.
          echo "Passe 2/2 — reste du site, comparaison par horodatage (inchangée)"
          lftp -u "$FTP_USER,$FTP_PASS" -p "${FTP_PORT:-21}" "$FTP_HOST" <<FTP
          $REGLAGES
          mirror --reverse --delete --parallel=2 --verbose \
            --exclude-glob _astro/ \
            --exclude-glob api/config.php \
            --exclude-glob api/.data/ \
            --exclude-glob public_html/ \
            dist/ "$CIBLE/"
          bye
          FTP

      - name: Rappel
        run: |
          echo "Déploiement terminé sur ${{ inputs.cible }}."
          echo "Vérifier api/config.php sur le serveur : il n'est jamais transféré."
